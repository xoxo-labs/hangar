<!doctype html>
<!-- `dark` is the selector the Radix dark scales imported by styles.css hang on.
     The markup starts dark; the inline script below settles the real theme from
     the cached setting before first paint, so neither theme ever flashes. -->
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>hangar</title>
    <script>
      try {
        const setting = localStorage.getItem("hangar-theme")
        const dark = setting === "dark" || (setting !== "light" && matchMedia("(prefers-color-scheme: dark)").matches)
        document.documentElement.classList.toggle("dark", dark)
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
