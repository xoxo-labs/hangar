<!doctype html>
<!-- `dark` is the selector the Radix dark scales imported by styles.css hang on.
     The markup starts dark; the inline script below settles the real theme from
     the cached setting before first paint, so neither theme ever flashes. -->
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Written from the public root, which the base: "./" build rewrites into
         relative URLs for file://. The SVG is what browsers prefer; the PNG is
         for the ones that ignore it, and iOS reads only apple-touch-icon. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>hangar</title>
    <script>
      try {
        const setting = localStorage.getItem("hangar-theme")
        const dark = setting === "dark" || (setting !== "light" && matchMedia("(prefers-color-scheme: dark)").matches)
        document.documentElement.classList.toggle("dark", dark)
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
