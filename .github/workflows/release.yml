name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# The release step creates/updates the GitHub release for the pushed tag.
permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    env:
      # The app ships unsigned (build.mac.identity is null); keep
      # electron-builder from hunting for a certificate on the runner.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm dist:mac
      # A version-free alias so the site can deep-link the newest build
      # directly: /releases/latest/download/Hangar-arm64.dmg
      - run: cp apps/desktop/release/Hangar-*-arm64.dmg apps/desktop/release/Hangar-arm64.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: hangar-mac
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/latest-mac.yml
      # electron-updater needs the ZIP and latest-mac.yml in addition to the
      # human-facing DMG; without them installed copies cannot discover/install.
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/latest-mac.yml
          generate_release_notes: true
