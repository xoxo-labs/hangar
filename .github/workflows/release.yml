name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# The release step creates/updates the GitHub release for the pushed tag.
permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # Developer ID signing + notarization, but only when the certificate
      # secret exists. A job-level `CSC_LINK: ${{ secrets... }}` would export
      # an empty-but-defined variable on secretless runs (Apple account still
      # under review, forks), which electron-builder resolves as a file path
      # and dies with "not a file" — so the env is written conditionally, and
      # unsigned interim builds still release (the site documents the xattr
      # workaround until signing lands).
      - name: Configure signing
        env:
          MAC_CERT: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_P12_PASSWORD }}
          NOTARIZE_APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARIZE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          NOTARIZE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$MAC_CERT" ]; then
            {
              echo "CSC_LINK=$MAC_CERT"
              echo "CSC_KEY_PASSWORD=$MAC_CERT_PASSWORD"
              echo "APPLE_ID=$NOTARIZE_APPLE_ID"
              echo "APPLE_APP_SPECIFIC_PASSWORD=$NOTARIZE_PASSWORD"
              echo "APPLE_TEAM_ID=$NOTARIZE_TEAM_ID"
              echo "SIGNING=enabled"
            } >> "$GITHUB_ENV"
          else
            {
              echo "CSC_IDENTITY_AUTO_DISCOVERY=false"
              echo "SIGNING=disabled"
            } >> "$GITHUB_ENV"
            echo "::warning::No signing certificate configured — releasing an unsigned build."
          fi
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm dist:mac
      # When signing is on, fail the release if the produced app is not
      # signed, notarized, and stapled — a silent fallback to an unsigned
      # build must not ship as a supposedly signed one.
      - name: Verify signature and notarization
        if: startsWith(github.ref, 'refs/tags/') && env.SIGNING == 'enabled'
        run: |
          APP="apps/desktop/release/mac-arm64/Hangar.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign --display --requirements - "$APP" 2>&1 | grep "Developer ID"
          xcrun stapler validate "$APP"
          spctl --assess --type execute --verbose=2 "$APP"
      # A version-free alias so the site can deep-link the newest build
      # directly: /releases/latest/download/Hangar-arm64.dmg
      - run: cp apps/desktop/release/Hangar-*-arm64.dmg apps/desktop/release/Hangar-arm64.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: hangar-mac
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest-mac.yml
      # electron-updater needs the ZIP and latest-mac.yml in addition to the
      # human-facing DMG; without them installed copies cannot discover/install.
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest-mac.yml
          generate_release_notes: true
